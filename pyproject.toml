[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Distribution name is `auditable-mcp-sdk`; the bare `auditable-mcp` name is left for the spec
# itself. The import package stays `auditable_mcp`.
[project]
name = "auditable-mcp-sdk"
version = "0.3.0"
description = "Auditable MCP SDK — a protocol machine for tool self-attestation into a tamper-evident host ledger (auditable-mcp/0.3)."
readme = "README.md"
# Developed and pinned on 3.14.7 (see .python-version); the published floor is kept lower for OSS reach.
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Satoshi Imai" }]
keywords = ["mcp", "audit", "tamper-evident", "ledger", "rfc8785", "ed25519"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # §7.1 makes atomic sealing a host conformance requirement, so the protocol machine needs a
    # mutual-exclusion primitive. anyio supplies one without binding this SDK to a single async
    # framework, the way asyncio.Lock would.
    "anyio>=4",
    "pydantic>=2.7",
    "rfc8785>=0.1.4",
    "cryptography>=42",
]

# The core is a pure protocol machine with no transport dependency; both extras are opt-in, and
# nothing outside `auditable_mcp.mcp` imports the MCP package. The KMS adapter takes an injected
# client and never imports boto3, so `[aws]` only provides the client for users who want it.
[project.optional-dependencies]
aws = ["boto3>=1.34"]
# Capped at the minor it is tested on: the MCP binding imports the official SDK's context-carrying
# streams and stream protocols from private modules (`mcp.shared._context_streams`,
# `mcp.shared._stream_protocols`), which a minor release may move.
mcp = ["mcp>=2.2,<2.3"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "jsonschema>=4.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/auditable_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
# Surface typeshed @deprecated (PEP 702) usages in CI, matching pyright's default reportDeprecated.
enable_error_code = ["deprecated"]
